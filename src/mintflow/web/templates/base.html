<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>{% block title %}{% endblock %} · MintFlow</title>
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.11.min.js') }}" defer></script>
  <script src="{{ static_url('js/app.js') }}" defer></script>
</head>
<body data-csrf-cookie="{{ csrf_cookie_name }}" data-csrf-header="{{ csrf_header_name }}">
  <a class="skip-link" href="#main">{{ _("Skip to content") }}</a>
  <header class="site-header">
    <a class="brand" href="/dashboard">MintFlow</a>
    {% block navigation %}
    <nav aria-label="{{ _('Main') }}">
      <ul>
        <li><a href="/dashboard"{% if active == "dashboard" %} aria-current="page"{% endif %}>{{ _("Dashboard") }}</a></li>
        <li><a href="/expenses"{% if active == "expenses" %} aria-current="page"{% endif %}>{{ _("Expenses") }}</a></li>
        <li><a href="/settings"{% if active == "settings" %} aria-current="page"{% endif %}>{{ _("Settings") }}</a></li>
        <li>
          <button type="button" class="link-button" hx-post="/auth/logout" hx-swap="none" data-redirect-after="/sign-in">{{ _("Sign out") }}</button>
        </li>
      </ul>
    </nav>
    {% endblock %}
  </header>
  <div id="status" class="status" role="status" aria-live="polite">{{ status_message | default("") }}</div>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
