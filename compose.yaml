services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    environment:
      MINTFLOW_ENVIRONMENT: ${MINTFLOW_ENVIRONMENT:-development}
      MINTFLOW_LOG_LEVEL: ${MINTFLOW_LOG_LEVEL:-INFO}
      MINTFLOW_ENABLE_API_DOCS: ${MINTFLOW_ENABLE_API_DOCS:-true}
      MINTFLOW_DATABASE_URL: ${MINTFLOW_DOCKER_DATABASE_URL:?Copy .env.example to .env}
      MINTFLOW_AUTHENTICATION_RATE_LIMIT_KEY: ${MINTFLOW_AUTHENTICATION_RATE_LIMIT_KEY:?Copy .env.example to .env}
      MINTFLOW_AUTHENTICATION_CSRF_SIGNING_KEY: ${MINTFLOW_AUTHENTICATION_CSRF_SIGNING_KEY:?Copy .env.example to .env}
      MINTFLOW_AUTHENTICATION_WEB_ORIGIN: ${MINTFLOW_AUTHENTICATION_WEB_ORIGIN:?Copy .env.example to .env}
      MINTFLOW_AUTHENTICATION_RETURN_TARGETS: ${MINTFLOW_AUTHENTICATION_RETURN_TARGETS:?Copy .env.example to .env}
      MINTFLOW_EMAIL_BACKEND: mailpit
      MINTFLOW_MAILPIT_SMTP_HOST: mailpit
      MINTFLOW_MAILPIT_SMTP_PORT: 1025
      MINTFLOW_MAILPIT_FROM_EMAIL: ${MINTFLOW_MAILPIT_FROM_EMAIL:-no-reply@mintflow.dev}
    ports:
      - "8000:8000"
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
